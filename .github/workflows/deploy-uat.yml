name: Deploy UAT - frontend

# Every push to the uat branch (including a merged pull request) builds the image,
# pushes it to Amazon ECR, then tells the EC2 server (through AWS Systems Manager)
# to pull it and restart the frontend container. The API address is compiled into the
# browser code at build time, so it comes from the repository variable
# NEXT_PUBLIC_API_BASE_URL (GitHub: Settings > Secrets and variables > Actions > Variables).

on:
  push:
    branches: [uat]
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-uat-frontend
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-1
  ECR_REPOSITORY: ssd-frontend
  INSTANCE_ID: i-0345041952a65ecbd
  SERVICE: frontend

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push the image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          API_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
        run: |
          IMAGE=$REGISTRY/$ECR_REPOSITORY
          docker build -t $IMAGE:uat -t $IMAGE:${GITHUB_SHA::7} \
            --build-arg NEXT_PUBLIC_API_BASE_URL=$API_URL \
            --build-arg NEXT_PUBLIC_AUTH_API_BASE_URL=$API_URL .
          docker push $IMAGE:uat
          docker push $IMAGE:${GITHUB_SHA::7}

      - name: Deploy on the server (SSM)
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          CMD="cd /opt/ssd && /usr/local/bin/aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $REGISTRY && docker compose pull $SERVICE && docker compose up -d $SERVICE && docker image prune -f && docker compose ps"
          jq -n --arg c "$CMD" '{commands:[$c]}' > params.json
          ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy $SERVICE ${GITHUB_SHA::7}" \
            --parameters file://params.json \
            --query Command.CommandId --output text)
          aws ssm wait command-executed --command-id "$ID" --instance-id "$INSTANCE_ID"
          aws ssm get-command-invocation --command-id "$ID" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text
